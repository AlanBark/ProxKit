[package]
name = "app"
version = "0.1.0"
description = "Proxy card layout and cut-file generation for Silhouette cutting machines"
authors = ["Alec Parkes"]
license = ""
repository = "https://github.com/AlanBark/proxy-print-and-cut"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[features]
default = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
krilla = { version = "0.6.0", features = ["rayon"] }
rayon = "1.10"
image = "0.25"
base64 = "0.22"
# Generates the TypeScript definitions for everything crossing the IPC
# boundary, so the two sides cannot describe the same payload differently.
ts-rs = "12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# Image decoding, cropping and PDF writing all happen in dependencies. Built
# unoptimized they are roughly an order of magnitude slower, which is why a dev
# build exported PDFs more slowly than the browser did. Our own crate stays at
# a low opt-level so backtraces and debugging still behave.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
